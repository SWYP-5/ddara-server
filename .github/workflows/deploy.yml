name: Deploy to EC2 (develop)

# develop 브랜치에 push(머지 포함)되면 자동 실행 + 수동 실행 버튼
on:
  push:
    branches: [develop]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH 키 준비
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: 서버에서 배포 실행
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} "
            cd ~/ddara-server &&
            git fetch origin develop &&
            git reset --hard origin/develop &&
            chmod +x gradlew &&
            ./gradlew bootJar -x test &&
            sudo systemctl restart ddara &&
            sleep 5 &&
            curl -fsS http://localhost:8080/api/health
          "