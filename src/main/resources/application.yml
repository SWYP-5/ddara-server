spring:
  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:mysql://localhost:3306/app_db?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:1234}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

jwt:
  secret: ${JWT_SECRET:your-secret-key-must-be-at-least-32-characters-long}
  access-token-expiration: 900000      # 15분 (ms)
  refresh-token-expiration: 2592000000 # 30일 (ms)

server:
  port: 8080

app:
  invite:
    base-url: ${INVITE_BASE_URL:https://ddara.app/invite/}
  upload:
    # 프로필 이미지를 저장할 서버 로컬 디렉터리 (EC2). DB엔 아래 base-url 기반 접근 URL만 저장.
    dir: ${UPLOAD_DIR:./uploads}
    base-url: ${UPLOAD_BASE_URL:http://localhost:8080}

aws:
  s3:
    bucket: ${AWS_S3_BUCKET:ddara-images}
    region: ${AWS_S3_REGION:ap-northeast-2}

---
# 배포(dev) 프로파일 전용 오버라이드.
# 프로필 이미지 접근 URL 앞부분을 EC2 주소로. (미설정 시 기본값 localhost가 나가 프론트가 이미지를 못 불러오는 문제 방지)
# 환경변수 UPLOAD_BASE_URL로 덮어쓸 수 있음.
spring:
  config:
    activate:
      on-profile: dev
app:
  upload:
    base-url: ${UPLOAD_BASE_URL:http://54.116.202.230}