spring:
  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:mysql://localhost:3306/app_db?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:1234}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

jwt:
  secret: ${JWT_SECRET:your-secret-key-must-be-at-least-32-characters-long}
  access-token-expiration: 900000      # 15분 (ms)
  refresh-token-expiration: 2592000000 # 30일 (ms)

server:
  port: 8080

app:
  invite:
    base-url: ${INVITE_BASE_URL:https://ddara.app/invite/}

aws:
  s3:
    bucket: ${AWS_S3_BUCKET:ddara-images}
    region: ${AWS_S3_REGION:ap-northeast-2}

discord:
  # 신고 접수 통지용 웹훅
  report-webhook-url: ${DISCORD_REPORT_WEBHOOK_URL:}
  # 유저 차단 통지용 웹훅
  block-webhook-url: ${DISCORD_BLOCK_WEBHOOK_URL:}

apple:
  team-id: ${APPLE_TEAM_ID:3PVV8DQPL6}
  key-id: ${APPLE_KEY_ID:HBT5YX26FZ}
  # iOS가 네이티브 애플 로그인이면 Bundle ID, 웹 플로우면 Service ID(com.swyp.ddara.service)로 교체
  client-id: ${APPLE_CLIENT_ID:com.ddara.team3}
  private-key-path: ${APPLE_PRIVATE_KEY_PATH:apple/AuthKey_HBT5YX26FZ.p8}